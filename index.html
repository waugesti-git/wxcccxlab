<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveChat</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
      }

      .livechat-wrapper {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div
      id="divicw"
      data-bind="E1EB884F-B82A-4389-991A-36E4C2906CD4"
      data-org=""
      data-guid="2d97533d-e8c1-4ba4-89c2-f2e65f74237a"
    ></div>

    <script>
      (function () {
        try {
          var host = document.getElementById("divicw");
          var script = document.createElement("script");

          script.src =
            "https://chat-widget.produs1.ciscoccsservice.com/js/imichatinit.js?d=" +
            new Date().toISOString();

          script.onload = function () {
            console.log(new Date().toISOString(), "Livechat script loaded successfully!");
          };

          script.onerror = function () {
            console.log(new Date().toISOString(), "Error loading Livechat script");
          };

          host.insertAdjacentElement("afterend", script);
        } catch (error) {
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
